[package]
name = "nixos-manager"
version = "0.1.0"
edition = "2024"

[dependencies]
fluent-bundle = "0.16"
iced = { version = "0.14", default-features = false, features = ["tiny-skia", "tokio", "wayland", "x11"] }
include_dir = { version = "0.7", features = ["glob"] }
rustix = { version = "1", features = ["fs", "process", "pty", "system", "termios"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3"
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "sync"] }
url = "2"
